<!--
  Source for public/og-image.jpg (1200x630). Regenerate after editing:
  chrome --headless=new --window-size=1200,630 --virtual-time-budget=12000 \n    --screenshot=og-image.png "file:///<abs-path>/scripts/og-card.html"
  then convert to JPEG (quality ~86) and save as public/og-image.jpg
-->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#05050a;font-family:Inter,system-ui,sans-serif;color:#f2f2f5;position:relative}
  .glow{position:absolute;inset:0}
  .glow::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(70% 80% at 78% 12%, rgba(255,59,74,.42), transparent 62%),
      radial-gradient(65% 75% at 8% 96%, rgba(31,79,216,.40), transparent 62%);}
  .halftone{position:absolute;inset:0;opacity:.16;
    background-image:radial-gradient(#fff 1.4px, transparent 1.5px);background-size:10px 10px;
    -webkit-mask-image:linear-gradient(115deg,#000 0%,transparent 58%);
            mask-image:linear-gradient(115deg,#000 0%,transparent 58%);}
  .frame{position:absolute;inset:22px;border:3px solid rgba(255,255,255,.13)}
  .wrap{position:relative;height:100%;display:flex;align-items:center;padding:0 74px;gap:52px}
  .left{flex:1;min-width:0;padding-bottom:34px}
  .kicker{display:inline-flex;background:#e8112d;color:#fff;
    font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:19px;
    letter-spacing:.16em;padding:9px 16px;transform:skewX(-8deg);margin-bottom:26px}
  .kicker span{display:block;transform:skewX(8deg)}
  h1{font-family:Anton,Impact,'Arial Black',sans-serif;font-weight:400;font-size:94px;
    line-height:.88;text-transform:uppercase;
    text-shadow:5px 5px 0 #14329e,-3px -3px 0 rgba(255,59,74,.85)}
  .rule{width:132px;height:7px;background:#ff3b4a;margin:26px 0 20px}
  p.sub{font-size:25px;line-height:1.36;color:#c3c3d0;max-width:610px;font-weight:500}
  .chips{display:flex;gap:10px;margin-top:26px;flex-wrap:nowrap}
  .chip{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:17px;font-weight:500;
    white-space:nowrap;border:2px solid rgba(255,255,255,.22);padding:7px 14px;
    background:rgba(255,255,255,.05)}
  .url{position:absolute;left:74px;bottom:46px;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:20px;font-weight:700;color:#ff3b4a;letter-spacing:.04em}
  .right{width:352px;flex:none;position:relative}
  .photo-wrap{width:352px;height:452px;overflow:hidden;position:relative;
    border:5px solid #f2f2f5;box-shadow:16px 16px 0 #e8112d,30px 30px 0 rgba(31,79,216,.9)}
  .photo-wrap img{position:absolute;width:1126px;height:1513px;max-width:none;
    left:-399px;top:-651px;filter:contrast(1.12) saturate(1.06) brightness(1.06)}
  .badge{position:absolute;top:-20px;left:-26px;background:#ffd54a;color:#14100c;
    font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:.08em;
    padding:8px 14px;transform:rotate(-7deg);text-transform:uppercase;z-index:2}
</style></head>
<body>
  <div class="glow"></div><div class="halftone"></div><div class="frame"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker"><span>SOFTWARE ENGINEER @ HSBC</span></div>
      <h1>SANDEEP<br>UTHAYAKUMAR</h1>
      <div class="rule"></div>
      <p class="sub">Backend systems, full-stack products and published ML research — as a 3D comic.</p>
      <div class="chips">
        <div class="chip">C++</div><div class="chip">Python</div>
        <div class="chip">React</div><div class="chip">Node.js</div>
        <div class="chip">IEEE · ScienceDirect</div>
      </div>
    </div>
    <div class="right">
      <div class="photo-wrap"><img src="../src/assets/About/portrait.jpg" alt=""></div>
      <div class="badge">Issue #00</div>
    </div>
  </div>
  <div class="url">sandeep2k5.netlify.app</div>
</body></html>
